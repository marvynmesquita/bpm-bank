name: Flutter Release Build (APK · AAB)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        flutter-version: '3.44.2'
        cache: true
        cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'
        cache-path: '${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:'

    - name: Cache Pub packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          ${{ runner.tool_cache }}/flutter/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          android/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Flutter Doctor
      run: flutter doctor -v

    - name: Get dependencies
      run: flutter pub get

    - name: Analyze code
      run: flutter analyze --no-fatal-infos

    - name: Create .env file
      run: |
        touch .env
        if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
        else
          echo "GROQ_API_KEY=placeholder" >> .env
        fi
        if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
        else
          echo "SUPABASE_URL=placeholder" >> .env
        fi
        if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        else
          echo "SUPABASE_ANON_KEY=placeholder" >> .env
        fi
        if [ -n "${{ secrets.SUPABASE_PASSWORD }}" ]; then
          echo "SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}" >> .env
        else
          echo "SUPABASE_PASSWORD=placeholder" >> .env
        fi
        echo "=== .env criado ==="
        wc -l .env

    - name: Build Web
      run: flutter build web --release --dart-define-from-file=.env

    - name: Build APK
      if: startsWith(github.ref, 'refs/tags/v')
      run: flutter build apk --release --dart-define-from-file=.env

    - name: Build AppBundle
      if: startsWith(github.ref, 'refs/tags/v')
      run: flutter build appbundle --release --dart-define-from-file=.env

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
